[pytest]
# Root suite: console tools only (coach.py, dashboard.py, launch.py,
# tools/verify_docs.py).  App suites live in <app>/tests and run in their own
# pytest process; use tools/run_tests.sh to run everything.  testpaths keeps a
# bare `pytest` at the repo root from crawling into the card / problem banks.
testpaths = tests
addopts = -q -m "not slow"
# pytest-timeout (requirements-dev.txt): a hung test fails with a traceback
# after 5 minutes instead of running until CI's job limit.  Tests that
# legitimately need longer raise it per-test with @pytest.mark.timeout(...).
timeout = 300
markers =
    slow: takes more than 30 s (excluded by default; run with -m slow)
