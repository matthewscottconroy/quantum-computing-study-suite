[pytest]
# One run covers everything: the root suite (tests/: the console tools, the
# shared package, tools/) and each app's own suite (quantum_study/<app>/tests/).
# `pytest quantum_study/exam_sim` runs one app; `pytest tests` the root suite.
testpaths = tests quantum_study
addopts = -q -m "not slow"
# pytest-timeout (requirements-dev.txt): a hung test fails with a traceback
# after 5 minutes instead of running until CI's job limit.  Tests that
# legitimately need longer raise it per-test with @pytest.mark.timeout(...).
timeout = 300
markers =
    slow: takes more than 30 s (excluded by default; run with -m slow)
