# Packaging and tool configuration for the Quantum Computing Study Suite.
#
# One package, `quantum_study`: the ten PyQt6 apps (`quantum_study.<app>`), the
# code they share (`quantum_study.common`) and the three console tools.  The
# teaching corpus (docs/, lesson-plans/, labs/, notebooks/, projects/) and the
# maintenance scripts (tools/) stay in the repository and are not packaged, so
# install it editable from a checkout: `./setup.sh`, `make dev`, or
# `pip install -e .`.  A plain wheel runs the apps, but their Reference
# screens need QUANTUM_STUDY_DOCS_DIR pointed at a copy of docs/.
#
# Test configuration lives in pytest.ini.

[build-system]
# setuptools >= 77 understands the PEP 639 `license = "MIT"` expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-study-suite"
dynamic = ["version"]
description = "A self-contained desktop learning suite for quantum computing: ten PyQt6 trainers, a teaching corpus, and console study tools for the IBM C1000-179 certification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matthew Scott Conroy", email = "matthewscottconroy@gmail.com" },
]
keywords = [
    "quantum-computing",
    "qiskit",
    "education",
    "flashcards",
    "spaced-repetition",
    "certification",
    "c1000-179",
    "pyqt6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Topic :: Scientific/Engineering :: Physics",
]

# Mirrors requirements.txt, which is what setup.sh and CI install.
# tests/test_packaging.py fails if the two lists (or the [dev] extra and
# requirements-dev.txt) drift apart.
dependencies = [
    "PyQt6>=6.6",
    # Checked against 1.0 and 2.8: the apps only call messages.create() without
    # sampling parameters, which is all API version 2026-10-21 (SDK 2.x) needs.
    "anthropic>=1.0,<3",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    "qiskit-qasm3-import>=0.6",
    "pylatexenc>=2.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    # tools/export_cards.py --apkg only
    "genanki>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/matthewscottconroy/quantum-computing-study-suite"
Repository = "https://github.com/matthewscottconroy/quantum-computing-study-suite"
Issues = "https://github.com/matthewscottconroy/quantum-computing-study-suite/issues"
Documentation = "https://github.com/matthewscottconroy/quantum-computing-study-suite/blob/main/docs/README.md"
Changelog = "https://github.com/matthewscottconroy/quantum-computing-study-suite/blob/main/ROADMAP.md"

[project.scripts]
# The launcher starts any app (`quantum-study exam`); each app is also
# `python -m quantum_study.<app>`.
quantum-study = "quantum_study.launch:main"
quantum-coach = "quantum_study.coach:main"
quantum-dashboard = "quantum_study.dashboard:main"

[tool.setuptools.dynamic]
version = { attr = "quantum_study.__version__" }

[tool.setuptools.packages.find]
include = ["quantum_study*"]
# Each app's tests live beside it (quantum_study/<app>/tests/) and are not shipped.
exclude = ["quantum_study.*.tests", "quantum_study.*.tests.*"]

[tool.setuptools.package-data]
"quantum_study.common" = ["README.md"]

# mypy is advisory in CI until its baseline is clean; no error code is silenced
# to get there.  python_version is unset on purpose: pinning it to the 3.11
# floor makes mypy parse the installed numpy stubs under 3.11 rules and abort.
[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true
files = ["quantum_study", "tools"]
exclude = '''(?x)
    (?: ^|/ ) (?: tests | \.venv | build | dist ) /
'''

[tool.coverage.run]
branch = true
source = ["quantum_study", "tools"]
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    ".venv/*",
    # One-file-per-item content banks: data, not code.
    "quantum_study/flashcard_drill/cards/*/*",
    "quantum_study/exam_sim/bank/*/*",
    "quantum_study/*/problems/*/*",
    "quantum_study/qiskit_dojo/katas/*/*",
]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(?:typing\\.)?overload",
]
