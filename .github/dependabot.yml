# Dependabot configuration for the Quantum Computing Study Suite.
#
# Two ecosystems, both weekly:
#   pip             requirements.txt, requirements-dev.txt and pyproject.toml
#                   at the repository root.  Dependabot reads every manifest it
#                   recognises in the configured directory, so one entry covers
#                   all three.  The ten per-app <app>/requirements.txt files are
#                   deliberately NOT listed: the root requirements.txt is the
#                   union of them (see its header), so ten extra directories
#                   would produce ten duplicate PRs for the same bump.  Keep the
#                   per-app files in step by hand when a root bump lands.
#   github-actions  the `uses:` pins in .github/workflows/*.yml.
#
# Minor and patch bumps are grouped into a single PR per ecosystem to keep the
# review queue short; majors stay ungrouped and arrive one PR at a time,
# because for this repo a major is a decision, not a chore -- requirements.txt
# caps qiskit at <3 and anthropic at <2 on purpose, and CI pins actions by
# major tag.  open-pull-requests-limit is 5 per ecosystem.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
