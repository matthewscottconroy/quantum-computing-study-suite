# Continuous integration: one job per supported Python.
#
# Byte-compile, verify the docs corpus, then ONE pytest run over everything:
# tests/ and every quantum_study/<app>/tests/.  The 3.14 leg makes that run
# under coverage and adds an advisory mypy pass.  release.yml calls this
# workflow as its gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels the run it supersedes.  Every other
# run gets a group of its own, so runs on main always finish with a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # What the PyQt6 wheel's bundled Qt links against for the offscreen
      # platform.  Mostly present on ubuntu-latest already; listing them makes
      # the requirement explicit, and the retry rides out a mirror hiccup.
      - name: Install Qt offscreen runtime libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq \
            || { sleep 15; sudo apt-get -o Acquire::Retries=3 update -qq; }
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 libx11-6 libfreetype6

      # A project-local .venv, because tools/verify_docs.py --snippets shells
      # out to .venv/bin/python.  The suite itself is installed editable so
      # `quantum_study` imports from any working directory, as it does for users.
      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pip install --no-deps -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Show environment
        run: |
          python --version
          python -m pip list

      - name: Byte-compile
        run: python -m compileall -q quantum_study tools tests conftest.py coach.py dashboard.py launch.py

      - name: Verify docs corpus
        run: python tools/verify_docs.py --all

      - name: Run every test
        if: matrix.python-version != '3.14'
        run: bash tools/run_tests.sh

      # The same run, measured.  Configuration is [tool.coverage.*] in
      # pyproject.toml; the one-file-per-item content banks are omitted there,
      # so the report is about code.
      - name: Run every test under coverage
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install "coverage>=7.5"
          coverage run -m pytest
          if compgen -G '.coverage.*' > /dev/null; then
            coverage combine
          fi
          coverage report --skip-covered --sort=cover | tail -n 60
          coverage xml -o coverage.xml
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo
            echo "Total: $(coverage report --format=total)%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      # ADVISORY: continue-on-error keeps a type error from failing the job
      # until the baseline is clean.  Delete that line when it reaches zero.
      - name: Type check (mypy, advisory)
        if: matrix.python-version == '3.14'
        continue-on-error: true
        run: |
          python -m pip install "mypy>=1.10"
          set +e
          mypy --no-pretty 2>&1 | tee mypy.log | tail -n 40
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### mypy (advisory)"
            echo
            echo '```'
            tail -n 1 mypy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
